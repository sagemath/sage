name: Publish documentation

on:
  workflow_run:
    workflows: ["CI", "Sage CI", "Build documentation"]
    types:
      - completed

permissions:
  actions: read
  statuses: write
  checks: write
  pull-requests: write


# This workflow runs after doc-build workflow, taking the
# artifact doc and deploying it to a netlify site.
#
# event (triggered doc-build)     URL (of the doc deployed to NETLIFY_SITE)
# ---------------------------     ---------------------------------
# on pull request                 https://doc-pr-12345--NETLIFY_SITE
# on push branch develop          https://doc-develop--NETLIFY_SITE
#
# where NETLIFY_SITE is presently sagemath.netlify.app for repo sagemath/sage.
#
# This workflow runs only if secrets NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are set.

jobs:
  publish-doc:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'cancelled'
    env:
      CAN_DEPLOY: ${{ secrets.NETLIFY_AUTH_TOKEN != '' &&  secrets.NETLIFY_SITE_ID != '' }}
    steps:
      # Another CI job may fail after documentation builds successfully.
      # Only deploy if this run actually produced the documentation artifact.
      - name: Check for documentation artifact
        id: artifact
        uses: actions/github-script@v9
        if: env.CAN_DEPLOY == 'true'
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.payload.workflow_run.id, per_page: 100,
            });
            core.setOutput('available', artifacts.some(a => a.name === 'doc' && !a.expired));

      - name: Resolve documentation preview destination
        id: source-run-info
        uses: actions/github-script@v9
        if: steps.artifact.outputs.available == 'true'
        with:
          script: |
            const run = context.payload.workflow_run;
            const repositoryId = context.payload.repository.id;
            const head = run.head_repository;

            if (run.event === 'push') {
              if (head?.id === repositoryId && run.head_branch === 'develop') {
                core.setOutput('alias', 'doc-develop');
              }
              return;
            }
            if (run.event !== 'pull_request') return;
            if (!head?.owner?.login || !run.head_branch || !run.head_sha) {
              throw new Error(`Run ${run.id} has incomplete PR head metadata`);
            }

            const sameBranch = pr =>
              pr.base.repo.id === repositoryId &&
              pr.head.repo?.id === head.id &&
              pr.head.ref === run.head_branch;
            const isCurrent = pr =>
              sameBranch(pr) && pr.state === 'open' && pr.head.sha === run.head_sha;

            // Check the live PR, not just the SHA recorded with the old run.
            const linked = (run.pull_requests ?? []).filter(pr => pr.base.repo.id === repositoryId);
            let candidates = await Promise.all(linked.map(async pr => {
              const {data} = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
              return data;
            }));
            let matches = candidates.filter(isCurrent);

            // GitHub can omit pull_requests for runs from forks.
            if (matches.length === 0) {
              const open = await github.paginate(github.rest.pulls.list, {
                ...context.repo, state: 'open', head: `${head.owner.login}:${run.head_branch}`,
                per_page: 100,
              });
              candidates = [...candidates, ...open];
              matches = open.filter(isCurrent);
            }

            if (matches.length === 0 && candidates.some(sameBranch)) {
              core.notice(`Skipping preview for run ${run.id}: the PR is closed or its head has changed`);
              return;
            }
            if (matches.length !== 1 || !Number.isSafeInteger(matches[0].number) || matches[0].number < 1) {
              throw new Error(`Cannot identify a unique open PR for documentation run ${run.id}`);
            }

            core.setOutput('pullRequestNumber', matches[0].number);
            core.setOutput('sourceHeadSha', run.head_sha);
            core.setOutput('alias', `doc-pr-${matches[0].number}`);

      - name: Download doc
        id: download-doc
        uses: actions/download-artifact@v8
        with:
          name: doc
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
        if: steps.source-run-info.outputs.alias != ''

      - name: Extract doc
        run: unzip doc.zip -d doc
        if: steps.download-doc.outcome == 'success'

      - name: Deploy to Netlify
        id: deploy-netlify
        uses: netlify/actions/cli@3185065f4ab2f6df6f2ef41ee013626e1c02a426 # master
        with:
          args: deploy --dir=doc/doc --message ${NETLIFY_MESSAGE} --alias ${NETLIFY_ALIAS}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_MESSAGE:  ${{ steps.source-run-info.outputs.alias }}
          NETLIFY_ALIAS: ${{ steps.source-run-info.outputs.alias }}
        if: steps.download-doc.outcome == 'success'

      # Add deployment as status check, PR comment and annotation we could use
      # the nwtgck/actions-netlify action for that, except for that it is not
      # (yet) working in workflow_run context: https://github.com/nwtgck/actions-netlify/issues/545
      - name: Add/Update deployment status PR comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.source-run-info.outputs.pullRequestNumber }}
          header: preview-comment
          recreate: false
          message: |
            [Documentation preview for this PR](${{ steps.deploy-netlify.outputs.NETLIFY_URL }}/html/en) (built with commit ${{ steps.source-run-info.outputs.sourceHeadSha }}; [changes](${{ steps.deploy-netlify.outputs.NETLIFY_URL }}/CHANGES.html)) is ready! :tada:
            This preview will update shortly after each push to this PR.
        if: steps.deploy-netlify.outcome == 'success' && steps.source-run-info.outputs.pullRequestNumber != ''

      - name: Update deployment status PR check
        uses: myrotvorets/set-commit-status-action@v2.0.1
        env:
          DEPLOY_SUCCESS: Successfully deployed preview.
          DEPLOY_FAILURE: Failed to deploy preview.
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          sha: ${{ github.event.workflow_run.head_sha }}
          context: Deploy Documentation
          targetUrl: ${{ steps.deploy-netlify.outputs.NETLIFY_URL }}
          description: ${{ job.status == 'success' && env.DEPLOY_SUCCESS || env.DEPLOY_FAILURE }}
        if: steps.download-doc.outcome == 'success'

      - name: Report deployment url
        run: |
          echo "::notice::The documentation has been deployed - ${{ steps.deploy-netlify.outputs.NETLIFY_URL }}"
        if: steps.download-doc.outcome == 'success'
