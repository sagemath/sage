name: Build & Test using Meson

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  workflow_dispatch:
    # Allow to run manually

concurrency:
  # Cancel previous runs of this workflow for the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pixi (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.tests }}${{ matrix.editable && ', editable' || '' }})
    runs-on: ${{ matrix.os }}-latest
    env:
      SEPARATELY_TESTED_FLAKY_FILES: "src/sage/libs/singular/function.pyx src/sage/rings/polynomial/plural.pyx"
      PIXI_ENVIRONMENT: ${{ matrix.python == '3.13' && 'py313' || 'py314' }}
      PIXI_CACHE_DIR: ${{ github.workspace }}/.pixi/cache

    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu', 'macos', 'windows']
        python: ['3.13', '3.14']
        tests: ['all']
        editable:
          ${{ fromJson(github.event_name == 'pull_request' && '[false]' || '[false, true]') }}
        include:
          # Test only changed files
          - os: 'ubuntu'
            python: '3.13'
            tests: 'new'
          # One additional editable run in pull_request, this has no effect if not pull_request
          - os: 'ubuntu'
            python: '3.13'
            editable: true
            tests: 'all'

    steps:
      - uses: actions/checkout@v7

      - name: Merge CI fixes from sagemath/sage
        run: |
          .github/workflows/merge-fixes.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mark new files as uncommited
        if: matrix.tests == 'new' 
        run: |
          # List remotes (for debugging)
          git remote -v
          # Reset the branch to develop
          git fetch origin develop
          git reset --soft origin/develop
          # Exclude packages that are not installed in this Pixi test job.
          git restore --source=origin/develop --staged --worktree -- src/sage_docbuild src/sage_setup
          # Show uncommitted changes
          git status

      - name: Cache dependency downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.PIXI_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-pixi-${{ env.PIXI_ENVIRONMENT }}-${{ hashFiles('pixi.lock') }}

      - name: Setup MSVC environment
        if: runner.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Remove Git link.exe
        if: runner.os == 'windows'
        # It conflicts with the vs linker 
        # So we delete it, following the advice on https://github.com/ilammy/msvc-dev-cmd?tab=readme-ov-file#name-conflicts-with-shell-bash 
        run: rm -f "C:/Program Files/Git/usr/bin/link.exe"
        shell: bash

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-meson-${{ env.PIXI_ENVIRONMENT }}

      - name: Setup Pixi environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          environments: ${{ env.PIXI_ENVIRONMENT }}
          activate-environment: true
          locked: true
          # Cache only downloads above; keep the local Sage build out of the cache.
          cache: false

      - name: Print Pixi environment
        shell: bash
        run: |
          pixi info
          pixi list --locked -e "$PIXI_ENVIRONMENT"

      - name: Check generated dependencies
        shell: bash
        run: |
          pixi run --locked -e "$PIXI_ENVIRONMENT" check-dependencies
          # These tooling tests run before Sage is built and need no Sage conftest.
          python -m pytest --noconftest -q tools/pixi_dependencies_test.py tools/pixi_build_test.py

      - name: Build
        shell: bash
        run: |
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            # Let Meson discover the compiler through the ccache wrappers.
            export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          fi

          # The build task uses --no-deps; pip check below verifies the locked dependencies.
          pixi run --locked -e "$PIXI_ENVIRONMENT" build ${{ !matrix.editable && '--wheel' || '' }} -- -v

      - name: Check update-meson
        # this step must be after build, because meson.build creates a number of __init__.py files
        # that is needed to make tools/update-meson.py run correctly
        shell: bash
        if: matrix.tests == 'all' && matrix.python == '3.13'
        run: |
          python tools/update-meson.py
          if ! ./tools/test-git-no-uncommitted-changes; then
            git add --intent-to-add .  # also show newly created files in git diff
            git status
            git diff
            false
          fi

      - name: Verify dependencies
        shell: bash
        run: python -m pip check

      - name: Test
        shell: bash
        run: |
          # We don't install sage_setup, so don't try to test it
          # If editable then deleting the directory will cause sage to detect rebuild, which will cause ninja to fail
          # so we don't delete the directory in this case
          ${{ matrix.editable && 'true' || 'rm -R ./src/sage_setup/' }}
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Ignore errors on Windows, for now
            pytest -n 4 --doctest-ignore-import-errors --doctest -rfEs -s src || true
          else
            pytest -n 4 -rfEs -s src
            ./sage -t ${{
              matrix.tests == 'all' &&
              '--all-except="$SEPARATELY_TESTED_FLAKY_FILES"' ||
              '--new --long' }} -p4 --format github
          fi

      - name: Test flaky files
        # unknown issues with plural.pyx causes sporadic failure: https://github.com/sagemath/sage/issues/29528
        # we rerun a few times, this step succeeds if any of the 5 runs succeed
        if: runner.os != 'windows' && matrix.tests == 'all'
        shell: bash
        run: |
          for i in {1..5}; do
            ./sage -t -p4 --format github $SEPARATELY_TESTED_FLAKY_FILES && break
          done

      - name: Check that all modules can be imported
        shell: bash
        run: |
          # Increase the length of the lines in the "short summary"
          export COLUMNS=120
          # The following command checks that all modules can be imported.
          # The output also includes a long list of modules together with the number of tests in each module.
          # This can be ignored.
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            pytest -n 4 -qq --doctest --collect-only || true
          else
            pytest -n 4 -qq --doctest --collect-only
          fi

      - name: Check for cyclic imports
        shell: bash
        run: |
          python tools/find_cyclic_imports.py --check --verbose

      - name: Upload log
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ runner.os }}-meson-${{ matrix.python }}${{ matrix.editable && '-editable' || '' }}${{ matrix.tests == 'new' && '-new' || '' }}-log
          path: .pixi/envs/${{ env.PIXI_ENVIRONMENT }}/sage-build/meson-logs/
