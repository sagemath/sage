name: Release distributions and wheels

on:
  push:
    tags:
      # Match all release tags including beta, rc
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.beta[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.beta[0-9]+'
      - '[0-9]+.[0-9]+.rc[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.rc[0-9]+'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    # Allow to run manually

jobs:

  release_dist:

    # This job first checks whether "configure --enable-download-from-upstream-url"
    # (the default since #32390) is needed.
    #
    # In this way, we check that all necessary package tarballs
    # have already been uploaded to the Sage server at the time
    # of pushing a release tag.
    #
    # It also uses "bootstrap -D", thus checking that the "configure"
    # tarball has been uploaded to the Sage server at the time
    # of pushing a release tag.

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bootstrap prerequisites
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install $(build/bin/sage-get-system-packages debian _bootstrap _prereq)
      - name: Configure with --enable-download-from-upstream-url
        run: |
          make configure
          ./configure
      - name: make dist (--enable-download-from-upstream-url)
        id: make_dist
        if: success() || failure()
        run: |
          make dist
        env:
          MAKE: make -j8
      - name: make download (--enable-download-from-upstream-url)
        if: (success() || failure()) && steps.make_download.outcome != 'success'
        run: |
          make -k download DOWNLOAD_PACKAGES=":all: --no-file huge --allow-upstream"
        env:
          MAKE: make -j8
      - name: Remove what cannot be distributed
        if: success() || failure()
        run: |
          rm -f upstream/*do-not-distribute*
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          path: |
            dist/*.tar.gz
            upstream
          name: release_dist

  make_sdist:
    runs-on: ubuntu-latest
    env:
      CAN_DEPLOY: ${{ secrets.SAGEMATH_PYPI_API_TOKEN != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: 3.12
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: true
          activate-environment: sage-dev
          environment-file: environment-3.12-linux.yml

      - name: Create source distribution
        shell: bash -l {0}
        run: |
          conda install --yes python-build
          python -m build --sdist --no-isolation --outdir dist .
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          path: "dist/*.tar.gz"
          name: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.SAGEMATH_PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
        if: env.CAN_DEPLOY == 'true'

  release:
    needs: [release_dist, make_sdist]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release_dist

      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist

      - name: Create release notes
        env:
          GITHUB_PAT: ${{ secrets.RELEASE_CREATION_TOKEN }}
        run: |
          latest_release_tag=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases \
          | jq -r 'sort_by(.created_at) | last(.[]).tag_name')
          release_notes=$(curl -s \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/releases/generate-notes \
            -d "{
              \"tag_name\": \"${{ github.ref_name }}\",
              \"previous_tag_name\": \"$latest_release_tag\"
            }" | jq -r '.body')
          echo "$release_notes" > release_notes

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          preserve_order: true
          files: |
            dist/*
            upstream/*
          token: ${{ secrets.RELEASE_CREATION_TOKEN }}
          body_path: release_notes
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: release-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  pypi-publish:
    # This needs to be a separate job because pypa/gh-action-pypi-publish cannot run on macOS
    name: Upload wheels to PyPI
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      
      - name: List files
        run: ls -l -R dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
