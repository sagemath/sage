name: Build documentation (PDF)

on:
  pull_request:
  merge_group:
  push:
    branches:
      - develop
  workflow_dispatch:
    # Allow to run manually

concurrency:
  # Cancel previous runs of this workflow for the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIXI_ENVIRONMENT: py313
  PIXI_CACHE_DIR: ${{ github.workspace }}/.pixi/cache

jobs:
  doc-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Maximize available disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          # Remove pre-installed packages like Docker, Android, .NET, etc.
          # We only keep the basic essentials (like compilers, etc.)
          preinstalled-runtimes: true

      - name: Merge CI fixes from sagemath/sage
        run: |
          .github/workflows/merge-fixes.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache dependency downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.PIXI_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-pixi-${{ env.PIXI_ENVIRONMENT }}-${{ hashFiles('pixi.lock') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-meson-${{ env.PIXI_ENVIRONMENT }}

      - name: Setup Pixi environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          environments: ${{ env.PIXI_ENVIRONMENT }}
          activate-environment: false
          locked: true
          # Cache only downloads above, not the Sage build or installed environment.
          cache: false

      - name: Build Sage
        shell: bash
        run: |
          # Let Meson discover the compiler through the ccache wrappers.
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          pixi run --locked -e "$PIXI_ENVIRONMENT" -- build --wheel --verbose

      - name: Build documentation
        shell: bash
        run: |
          sudo DEBIAN_FRONTEND=noninteractive sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install $(build/bin/sage-get-system-packages debian texlive texlive_luatex free_fonts xindy)
          pixi run --locked -e "$PIXI_ENVIRONMENT" -- meson compile -C ".pixi/envs/$PIXI_ENVIRONMENT/sage-build" doc-pdf
        env:
          SAGE_DOCBUILD_OPTS: "--include-tests-blocks"

      - name: Copy doc
        id: copy
        run: |
          mkdir -p ./doc
          cp -r ".pixi/envs/$PIXI_ENVIRONMENT/sage-build/src/doc/pdf" doc/
          # Zip everything for increased performance
          zip -r doc-pdf.zip doc

      - name: Upload doc
        uses: actions/upload-artifact@v7
        with:
          name: doc-pdf
          path: doc-pdf.zip
