name: Build & Test with all meson features disabled

# TODO:
#
#   * -Dbrial=disabled
#   * -Declib=disabled
#   * -Dauto_features=disabled (when all others are working)

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  workflow_dispatch:
    # Allow to run manually

concurrency:
  # Cancel previous runs of this workflow for the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pixi minimal (${{ matrix.os }}, Python ${{ matrix.python }}, all)
    runs-on: ${{ matrix.os }}-latest
    env:
      PIXI_ENVIRONMENT: minimal-py314
      PIXI_CACHE_DIR: ${{ github.workspace }}/.pixi/cache

    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu']
        python: ['3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Merge CI fixes from sagemath/sage
        run: |
          .github/workflows/merge-fixes.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache dependency downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.PIXI_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-pixi-${{ env.PIXI_ENVIRONMENT }}-${{ hashFiles('pixi.lock') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-meson-${{ matrix.python }}-minimal

      - name: Setup Pixi environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          environments: ${{ env.PIXI_ENVIRONMENT }}
          activate-environment: false
          locked: true
          cache: false

      # Build without the packages whose support we are disabling, to
      # be on the safe side. The -Dfoo=disabled option is an off switch
      # for sage.features.foo, but it's possible that some parts of the
      # code are bypassing the feature framework and e.g. attempting
      # to detect an optional package with an import statement. We want
      # those to fail as well.
      - name: Check minimal environment
        shell: bash
        run: |
          pixi run --locked -e "$PIXI_ENVIRONMENT" -- check-dependencies
          pixi run --locked -e "$PIXI_ENVIRONMENT" -- python - <<'PY'
          import json
          import sys
          from pathlib import Path

          excluded = {"bliss", "libbraiding", "libhomfly", "rw", "sirocco"}
          installed = {
              json.loads(path.read_text())["name"]
              for path in (Path(sys.prefix) / "conda-meta").glob("*.json")
          }
          assert installed, "No package records found in the Pixi environment"
          assert not installed & excluded, f"Minimal environment contains {installed & excluded}"
          PY

      - name: Print Pixi environment
        shell: bash
        run: |
          pixi info
          pixi list --locked -e "$PIXI_ENVIRONMENT"

      - name: Build
        shell: bash
        run: |
          # Let Meson discover the compiler through the ccache wrappers.
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"

          pixi run --locked -e "$PIXI_ENVIRONMENT" -- meson setup --buildtype=release --python.install-env=prefix --prefix="$GITHUB_WORKSPACE/.pixi/envs/$PIXI_ENVIRONMENT" --wrap-mode=nodownload -Dbuild-docs=false -Dbliss=disabled -Dcoxeter3=disabled -Dlibbraiding=disabled -Dlibhomfly=disabled -Dmcqd=disabled -Dmeataxe=disabled -Drankwidth=disabled -Dsirocco=disabled -Dtdlib=disabled ".pixi/envs/$PIXI_ENVIRONMENT/sage-build"
          pixi run --locked -e "$PIXI_ENVIRONMENT" -- meson install -C ".pixi/envs/$PIXI_ENVIRONMENT/sage-build"

      - name: Check that all modules can be imported
        shell: bash
        run: |
          # We want pytest to ignore sage_setup and sage_docbuild when
          # they are not installed (not able to be imported). We also
          # kill src/build-docs.py because it is used to build the
          # docs and thus imports sage_docbuild.
          rm -R src/sage_setup src/sage_docbuild src/build-docs.py

          # Increase the length of the lines in the "short summary"
          export COLUMNS=120

          # The following command checks that all modules can be imported.
          # The output also includes a long list of modules together with
          # the number of tests in each module (this can be ignored).
          # We do this before the "Test" step because we delete two
          # modules with flaky tests in that step, but we'd still like
          # to make sure that pytest can import them.
          pixi run --locked -e "$PIXI_ENVIRONMENT" -- python -m pytest -n 4 -qq --doctest --collect-only

      - name: Test
        shell: bash
        run: |
          pixi run --locked -e "$PIXI_ENVIRONMENT" -- python -m pytest -n 4 -rfEs -s src

          # These modules have flaky tests, and don't use any optional
          # features in any case.
          rm src/sage/libs/singular/function.pyx
          rm src/sage/rings/polynomial/plural.pyx

          # These are all sage-the-distro scripts, and at least one
          # is so bit-rotted that it can't be imported.
          rm -R src/bin

          # Two failures (GH issue 39872) that should be fixed in
          # the (as yet unreleased) cython-3.3. Not worth losing
          # sleep over at the moment.
          rm src/sage/misc/sageinspect.py

          # Hides a spurious warning that breaks a doctest
          export PYDEVD_DISABLE_FILE_VALIDATION=1

          pixi run --locked -e "$PIXI_ENVIRONMENT" -- python -m sage.doctest -p4 --format github src

      - name: Upload log
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ runner.os }}-meson-${{ matrix.python }}-minimal-log
          path: .pixi/envs/${{ env.PIXI_ENVIRONMENT }}/sage-build/meson-logs/
