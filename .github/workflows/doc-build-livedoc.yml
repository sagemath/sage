name: Build live documentation

on:
  push:
    tags:
      # Match all release tags including beta, rc
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.beta[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.beta[0-9]+'
      - '[0-9]+.[0-9]+.rc[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.rc[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

env:
  PIXI_ENVIRONMENT: py313
  PIXI_CACHE_DIR: ${{ github.workspace }}/.pixi/cache
  SAGE_USE_CDNS: "yes"
  SAGE_LIVE_DOC: "yes"
  SAGE_JUPYTER_SERVER: "binder:sagemath/sage-binder-env/dev"

jobs:
  livedoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Maximize available disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          # Remove pre-installed packages like Docker, Android, .NET, etc.
          # We only keep the basic essentials (like compilers, etc.)
          preinstalled-runtimes: true

      - name: Cache dependency downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.PIXI_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-pixi-${{ env.PIXI_ENVIRONMENT }}-${{ hashFiles('pixi.lock') }}

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-meson-${{ env.PIXI_ENVIRONMENT }}

      - name: Setup Pixi environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          environments: ${{ env.PIXI_ENVIRONMENT }}
          activate-environment: false
          locked: true
          # Cache only downloads above, not the patched jupyter-sphinx installation.
          cache: false

      - name: Patch jupyter-sphinx for live doc
        shell: bash
        run: |
          JUPYTER_SPHINX_DIR=$(pixi run --locked -e "$PIXI_ENVIRONMENT" -- python -c "import jupyter_sphinx; print(jupyter_sphinx.__path__[0])")
          pixi run --locked -e "$PIXI_ENVIRONMENT" -- patch -p2 -d "$JUPYTER_SPHINX_DIR" < build/pkgs/jupyter_sphinx/patches/0001-Patch-for-sage-live-doc.patch

      - name: Build Sage
        shell: bash
        run: |
          # Let Meson discover the compiler through the ccache wrappers.
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          pixi run --locked -e "$PIXI_ENVIRONMENT" -- build --wheel --verbose

      - name: Build live doc
        shell: bash
        run: |
          pixi run --locked -e "$PIXI_ENVIRONMENT" -- meson compile -C ".pixi/envs/$PIXI_ENVIRONMENT/sage-build" doc-html -j2

      - name: Build pdf doc
        shell: bash
        run: |
          sudo DEBIAN_FRONTEND=noninteractive sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install $(build/bin/sage-get-system-packages debian texlive texlive_luatex free_fonts xindy)
          pixi run --locked -e "$PIXI_ENVIRONMENT" -- meson compile -C ".pixi/envs/$PIXI_ENVIRONMENT/sage-build" doc-pdf

      - name: Copy doc
        id: copy
        run: |
          mkdir -p ./doc
          cp -r ".pixi/envs/$PIXI_ENVIRONMENT/sage-build/src/doc/pdf" doc/
          cp -rL ".pixi/envs/$PIXI_ENVIRONMENT/sage-build/src/doc/html" doc/
          cp ".pixi/envs/$PIXI_ENVIRONMENT/sage-build/src/doc/index.html" doc/
          zip -r livedoc.zip doc

      - name: Upload livedoc
        uses: actions/upload-artifact@v7
        with:
          name: livedoc
          path: livedoc.zip

      - name: Upload docs to release
        uses: softprops/action-gh-release@v3.0.1
        with:
          files: livedoc.zip
          token: ${{ secrets.RELEASE_CREATION_TOKEN }}
        if: github.ref_type == 'tag'
