name: Static type check

on:
  merge_group:
  push:
    branches:
      - master
      - develop
  pull_request:
  workflow_dispatch:
    # Allow to run manually

concurrency:
  # Cancel previous runs of this workflow for the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    name: Type check
    runs-on: ubuntu-latest
    env:
      PIXI_ENVIRONMENT: py313
      PIXI_CACHE_DIR: ${{ github.workspace }}/.pixi/cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Merge CI fixes from sagemath/sage
        run: |
          .github/workflows/merge-fixes.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache dependency downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.PIXI_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-pixi-${{ env.PIXI_ENVIRONMENT }}-${{ hashFiles('pixi.lock') }}

      - name: Setup Pixi environment
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          environments: ${{ env.PIXI_ENVIRONMENT }}
          activate-environment: false
          locked: true
          cache: false

        # No need to build sagelib; pyright only needs the libraries from which sagelib imports

      - name: Static code check with ty
        shell: bash
        run: pixi run --locked -e "$PIXI_ENVIRONMENT" -- ty check --output-format=github

      - name: Static code check with pyright
        uses: jakebailey/pyright-action@v3.0.2
        with:
          version: 1.1.332
          annotate: "errors"
          python-path: ${{ github.workspace }}/.pixi/envs/${{ env.PIXI_ENVIRONMENT }}/bin/python
        env:
          # To avoid out of memory errors
          NODE_OPTIONS: --max-old-space-size=8192
