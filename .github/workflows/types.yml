name: Static type check

on:
  workflow_call:

jobs:
  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Merge CI fixes from sagemath/sage
        run: |
          .github/workflows/merge-fixes.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache conda packages
        uses: actions/cache@v6
        with:
          path: ~/conda_pkgs_dir
          key:
            ${{ runner.os }}-conda-${{ hashFiles('environment-3.13-linux.yml') }}

      - name: Setup Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: 3.13
          miniforge-version: latest
          use-mamba: true
          channels: conda-forge
          channel-priority: true
          activate-environment: sage-dev
          environment-file: environment-3.13-linux.yml

        # No need to build sagelib; pyright only needs the libraries from which sagelib imports

      - name: Static code check with ty
        shell: bash -l {0}
        run: ty check --output-format=github

      - name: Static code check with pyright
        uses: jakebailey/pyright-action@v3.0.2
        with:
          version: 1.1.332
          annotate: "errors"
        env:
          # To avoid out of memory errors
          NODE_OPTIONS: --max-old-space-size=8192
