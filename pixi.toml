[workspace]
channels = ["conda-forge"]
description = "SageMath development environment"
name = "sage-dev"
platforms = [
  "linux-64",
  "linux-aarch64",
  # The new Accelerate BLAS interface requires macOS 13.3 or later.
  "win-64",
  { macos = "13.3", platform = "osx-64" },
  { macos = "13.3", platform = "osx-arm64" },
]
requires-pixi = ">=0.84.1"

[target.unix.activation.env]
# Maxima's default cache key cannot distinguish different builds of ECL.
MAXIMA_OBJDIR = "$CONDA_PREFIX/sage-build/maxima-cache"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = { features = ["py313"], solve-group = "py313" }
py313 = { features = ["py313"], solve-group = "py313" }
py314 = { features = ["py314"], solve-group = "py314" }

[tasks]
build = { cmd = "python tools/pixi-build.py", description = "Build and install this checkout for development" }
check-dependencies = { cmd = "python tools/update-pixi.py --check", description = "Check generated dependency requirements" }
sage = { cmd = "sage", description = "Run Sage from this environment" }
test = { cmd = "python -m sage.doctest", description = "Run Sage doctests (append files and test options)" }

